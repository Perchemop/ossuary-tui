name: Bug report
description: Something in Ossuary is not working as expected.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Please do not paste
        personal information (real names, email addresses, home paths) here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ossuary`
        2. Press ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Ossuary version
      description: Shown in the bottom-right corner, or from `ossuary --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and terminal
      placeholder: "e.g. Linux, GNOME Terminal"
    validations:
      required: true
