name: Release

# A release never depends on a human remembering the local build steps: the
# maintainer's machine is constrained, so the artefacts are assembled here
# (guide §4, §6.3).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tokens:
        description: "Tokens consumed by this release (for docs/tokens.json)"
        required: false
        default: "0"

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: ossuary-linux-x86_64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: ossuary-linux-arm64
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: ossuary-macos-arm64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: ossuary-windows-x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artefact (${{ matrix.name }})
        shell: bash
        run: |
          set -euo pipefail
          STAGE="${{ matrix.asset }}"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          BIN=""
          for cand in "target/${{ matrix.target }}/release/ossuary" \
                      "target/${{ matrix.target }}/release/ossuary.exe"; do
            if [ -f "$cand" ]; then BIN="$cand"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "no release binary found under target/${{ matrix.target }}/release" >&2
            ls -la "target/${{ matrix.target }}/release" >&2 || true
            exit 1
          fi
          echo "packaging binary: $BIN"
          cp "$BIN" "$STAGE/"
          cp README.md "$STAGE/" 2>/dev/null || true
          cp LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md "$STAGE/" 2>/dev/null || true
          OUT="${{ matrix.asset }}.zip"
          rm -f "$OUT"
          if command -v zip >/dev/null 2>&1; then
            (cd "$STAGE" && zip -qr "../$OUT" .)
          else
            powershell.exe -NoProfile -Command \
              "Compress-Archive -Path '$STAGE' -DestinationPath '$OUT' -Force" \
              || powershell -NoProfile -Command \
              "Compress-Archive -Path '$STAGE' -DestinationPath '$OUT' -Force"
          fi
          test -f "$OUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Collect artefacts and checksums
        id: collect
        run: |
          set -euo pipefail
          files=$(find dist -type f -name '*.zip' | sort)
          : > dist/SHA256SUMS.txt
          for f in $files; do
            (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> dist/SHA256SUMS.txt
          done
          cat dist/SHA256SUMS.txt
          {
            echo "files<<EOF"
            for f in $files dist/SHA256SUMS.txt; do echo "$f"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Scan release assets for personal data (guide II.29.3)
        run: bash scripts/scan-release-assets.sh dist

      - name: Build release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "body<<CHANGELOG_EOF"
            python3 scripts/release-notes.py "${GITHUB_REF_NAME#v}" || true
            echo
            echo "### Token usage"
            python3 scripts/token-summary.py "${GITHUB_REF_NAME#v}" "${RELEASE_TOKENS:-0}" 2>/dev/null || echo "Token metrics are recorded in docs/tokens.json."
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          RELEASE_TOKENS: ${{ inputs.release_tokens || vars.RELEASE_TOKENS || '0' }}

      - name: Record token metrics for the tag (guide §12.1)
        if: ${{ github.ref_type == 'tag' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TOKENS: ${{ inputs.release_tokens || vars.RELEASE_TOKENS || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          git config user.name "Ossuary Dev"
          git config user.email "dev@example.com"
          git fetch origin main
          git checkout -B "chore/token-ledger-${tag}" origin/main
          python3 scripts/update-token-ledger.py "${tag}" "${RELEASE_TOKENS}"
          git add docs/tokens.json
          if git diff --cached --quiet; then
            echo "ledger already records ${tag}; nothing to commit"
            exit 0
          fi
          git commit -m "chore(release): record token metrics for ${tag}"
          git push --force origin "HEAD:chore/token-ledger-${tag}"
          gh pr create --base main --head "chore/token-ledger-${tag}" \
            --title "chore(release): token metrics for ${tag}" \
            --body "Automated guide §12.1 token-ledger update for ${tag}." \
            || echo "PR already exists for chore/token-ledger-${tag}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_BODY: ${{ steps.notes.outputs.body }}
          ARTEFACTS: ${{ steps.collect.outputs.files }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            prerelease=()
          else
            tag="dispatch-$(date -u +%Y%m%d-%H%M%S)"
            prerelease=(--prerelease)
          fi
          if [[ -z "${NOTES_BODY//[[:space:]]/}" ]]; then
            NOTES_BODY="Automated release build for Ossuary ${tag}."
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Ossuary ${tag}" --notes "$NOTES_BODY" "${prerelease[@]}"
          else
            echo "release $tag already exists; uploading assets"
          fi
          mapfile -t artefacts <<< "$ARTEFACTS"
          gh release upload "$tag" "${artefacts[@]}" --clobber
          gh release edit "$tag" --draft=false
