name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The authoritative check for `ci.sh` (see .ci-required.txt): lint, tests,
  # the dependency gate, a release build of the primary-OS binary, the two
  # scans, and formatting.
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # whole-history scans (guide II.29)

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # Compile/lint/test first, so a formatting-only problem still comes back
      # with the full build signal in the same run.
      - name: Clippy (no warnings)
        run: cargo clippy --all-targets --workspace -- -D warnings

      - name: Tests (headless, no display)
        run: cargo test --workspace

      - name: Cargo deny (licences, advisories, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features

      # A compile gate only: Ossuary publishes no binaries (it is a terminal
      # program you build or `cargo install` yourself).
      - name: Build (release)
        run: cargo build --release

      # Prove the app actually runs and draws, headlessly under a pty.
      - name: Terminal smoke test (pseudo-terminal)
        run: python3 scripts/pty-smoke.py target/release/ossuary

      # Regenerate the README preview images so they can be reviewed and
      # committed without a terminal (the renderer lives in the headless core).
      - name: Generate preview images
        run: cargo run -p ossuary --release --example preview -- /tmp/preview

      - name: Upload preview images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ossuary-preview
          path: /tmp/preview/*.svg
          if-no-files-found: error

      # The lockfile is generated here and uploaded so it can be committed
      # without ever running cargo on the maintainer's machine (guide §4).
      - name: Upload generated Cargo.lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ossuary-cargo-lock
          path: Cargo.lock
          if-no-files-found: error

      - name: SBOM (dependency list)
        run: cargo tree --workspace > /tmp/dependency-sbom.txt

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ossuary-sbom
          path: /tmp/dependency-sbom.txt
          if-no-files-found: error

      - name: Secret scan (tracked files)
        run: bash scripts/scan-secrets.sh

      - name: Personal data scan (tracked files)
        run: bash scripts/scan-personal-data.sh

      # Formatting is checked last (and is still a hard gate). If it fails, the
      # next step uploads rustfmt's output so the maintainer — whose machine
      # cannot run cargo — can apply it offline. See docs/process-feedback.md.
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Prepare rustfmt output for offline application
        if: failure()
        run: |
          set -euo pipefail
          rm -rf /tmp/fmt && mkdir -p /tmp/fmt
          tar --exclude=./target --exclude=./.git -cf - . | (cd /tmp/fmt && tar -xf -)
          (cd /tmp/fmt && cargo fmt --all)
          (cd /tmp/fmt && tar -czf /tmp/rustfmt-src.tgz $(git -C "$GITHUB_WORKSPACE" ls-files '*.rs'))

      - name: Upload rustfmt output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rustfmt-src
          path: /tmp/rustfmt-src.tgz
          if-no-files-found: warn

  # Real cross-platform verification: the same headless tests run on Linux,
  # macOS and Windows. Nothing is built for distribution — this only proves the
  # code compiles and behaves on each OS (source-only distribution).
  matrix:
    name: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.os }}
      - name: Tests (headless, no display)
        run: cargo test --workspace
      - name: Build (release)
        run: cargo build --release

  # Internal build artefacts so the maintainer can install Ossuary on this
  # machine without ever running cargo locally. These are CI artefacts with a
  # retention period — they are NOT published releases, and the source-only
  # distribution rule (DECISIONS.md D-007) still stands.
  installable:
    name: installable (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            os: ubuntu-24.04-arm
          - name: linux-x86_64
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: installable-${{ matrix.name }}
      - name: Build (release)
        run: cargo build --release -p ossuary
      - name: Terminal smoke test (pseudo-terminal)
        run: python3 scripts/pty-smoke.py target/release/ossuary
      - name: Upload installable binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ossuary-${{ matrix.name }}
          path: target/release/ossuary
          if-no-files-found: error
