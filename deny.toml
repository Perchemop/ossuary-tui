# cargo-deny configuration — dependency licence class + advisory gate in CI
# (guide Part II §19.2/§19.4/§20.3). Licence policy mirrors AGENTS.md and
# ATTRIBUTION.md: permissive licences allowed; strong copyleft (GPL/AGPL)
# banned without explicit maintainer approval.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT", "MIT-0",
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
    "ISC", "BSD-2-Clause", "BSD-3-Clause", "BSD-4-Clause", "0BSD",
    "BSL-1.0", "Zlib",
    "Unlicense",
    "Unicode-3.0", "Unicode-DFS-2016",
    "CC0-1.0", "CDLA-Permissive-2.0",
    "MPL-2.0",
    "LGPL-2.1-only", "LGPL-2.1-or-later", "LGPL-3.0-only", "LGPL-3.0-or-later",
    # ring (via rustls) ships under a permissive ISC/MIT/OpenSSL composite.
    "OpenSSL",
    "OFL-1.1", "Ubuntu-font-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[advisories]
unmaintained = "workspace"
unsound = "workspace"
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
