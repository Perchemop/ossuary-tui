[package]
name = "update-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Shared update checking for the Ossuary suite: GitHub Releases API, semantic version comparison, fail-soft offline."
repository = "https://github.com/Perchemop/ossuary-tui"
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ureq 3's `rustls` default feature uses the ring provider only, so CI needs no
# CMake/NASM (aws-lc) and no system OpenSSL. `json` adds `Body::read_json`.
ureq = { version = "3", features = ["json"] }
