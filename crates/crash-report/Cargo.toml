[package]
name = "crash-report"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Shared crash reporting for the Ossuary suite: a panic hook and scrubbed, local-only diagnostics capture. No network."
repository = "https://github.com/Perchemop/ossuary-tui"
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
